[package]
name = "ox-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ox-desk-core = { path = "../ox-desk-core" }
ox-memory = { path = "../ox-memory" }
ox-host-service = { path = "../ox-host-service" }
ox-host-web = { path = "../ox-host-web", features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
reqwest = {version="0.12",default-features=false,features=["blocking","json"]}
getrandom = "0.3"
tokio = { version = "1", features = ["sync"] }
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
uuid = { version = "1", features = ["serde", "v4"] }
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
tempfile = "3"

[dev-dependencies]
ox-host-web = {path="../ox-host-web", features=["server","fixture-transport"]}

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice"] }
